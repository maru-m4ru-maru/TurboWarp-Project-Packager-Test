<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurboWarp Cloud Variable Diagnostic</title>
<style>
:root{color-scheme:light dark}
body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#f6f7f9;color:#111}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee;font-size:13px}
.value{font-size:44px;font-weight:700;margin:10px 0}
pre{background:#111;color:#eee;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;min-height:80px}
.meta{display:grid;gap:6px}
small{color:#666}
button{padding:8px 12px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){body{background:#151515;color:#eee}.card{background:#222;border-color:#444}button{background:#222;color:#eee;border-color:#555}small{color:#aaa}}
</style>
</head>
<body>
<div class="card">
  <h1>TurboWarp Cloud Variable Diagnostic</h1>
  <p><span id="status" class="badge">接続前</span></p>
  <div class="meta">
    <div>Project ID: <code id="projectId"></code></div>
    <div>Username: <code id="username"></code></div>
    <div>Cloud host: <code id="host"></code></div>
  </div>
  <p><button id="reconnect" type="button">再接続</button></p>
  <small>WebSocketを1本だけ維持し、サーバーから届く更新をイベントとして処理します。</small>
</div>
<div class="card">
  <h2>☁ score</h2>
  <div id="score" class="value">—</div>
  <small id="lastUpdate">まだ更新を受信していません</small>
</div>
<div class="card">
  <h2>受信ログ</h2>
  <pre id="log"></pre>
</div>
<div class="card">
  <h2>エラーログ</h2>
  <pre id="errors"></pre>
</div>
<script>
'use strict';

const projectId = 'p4-@プロジェクト.sb3';
const username = 'player' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
const hosts = ['wss://clouddata.turbowarp.org', 'wss://clouddata.turbowarp.xyz'];

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const errorsEl = document.getElementById('errors');
const scoreEl = document.getElementById('score');
const lastUpdateEl = document.getElementById('lastUpdate');
const hostEl = document.getElementById('host');

document.getElementById('projectId').textContent = projectId;
document.getElementById('username').textContent = username;

let ws = null;
let hostIndex = 0;
let closingForReconnect = false;

function now() {
  return new Date().toLocaleTimeString();
}

function appendLog(message) {
  logEl.textContent = `[${now()}] ${message}\n` + logEl.textContent;
}

function appendError(message) {
  errorsEl.textContent = `[${now()}] ${message}\n` + errorsEl.textContent;
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.style.background = kind === 'ok' ? '#d8f7df' : kind === 'error' ? '#ffe0e0' : '#eee';
}

function sendHandshake() {
  const message = {
    method: 'handshake',
    user: username,
    project_id: projectId
  };
  const raw = JSON.stringify(message);
  ws.send(raw);
  appendLog('送信: ' + raw);
}

function handleMessage(data) {
  const raw = String(data);
  for (const line of raw.split('\n')) {
    if (!line) continue;
    try {
      const message = JSON.parse(line);
      appendLog('受信: ' + JSON.stringify(message));
      if (message.method === 'set') {
        if (message.name === '☁ score' || message.name === 'score') {
          scoreEl.textContent = message.value;
          lastUpdateEl.textContent = `最終更新: ${now()}`;
        }
      }
    } catch (error) {
      appendError('サーバーから無効なJSONを受信しました: ' + line);
      appendError('JSON解析エラー: ' + error.message);
    }
  }
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    appendLog('既存のWebSocket接続を使用します。新しい接続は作成しません。');
    return;
  }

  const host = hosts[hostIndex % hosts.length];
  hostEl.textContent = host;
  setStatus('接続中...', 'pending');
  appendLog('接続: ' + host);

  try {
    ws = new WebSocket(host);
  } catch (error) {
    appendError('WebSocket生成エラー: ' + error.message);
    setStatus('接続エラー', 'error');
    return;
  }

  ws.addEventListener('open', () => {
    setStatus('接続済み', 'ok');
    appendLog('WebSocket connected');
    sendHandshake();
  });

  ws.addEventListener('message', event => handleMessage(event.data));

  ws.addEventListener('error', () => {
    appendError('WebSocket error');
  });

  ws.addEventListener('close', event => {
    setStatus('切断', 'error');
    appendError(`connection closed with code ${event.code}`);
    if (event.reason) appendError(`close reason: ${event.reason}`);
    ws = null;
    if (closingForReconnect) {
      closingForReconnect = false;
      connect();
    }
  });
}

document.getElementById('reconnect').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    closingForReconnect = true;
    appendLog('現在の接続を閉じて、手動で再接続します...');
    ws.close();
    return;
  }
  connect();
});

connect();
</script>
</body>
</html>
